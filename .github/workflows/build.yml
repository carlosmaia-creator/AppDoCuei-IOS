name: Build iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar Flet CLI
        run: |
          pip install flet

      - name: Compilar App para iOS (IPA sem assinatura)
        run: |
          flet build ipa --yes --flutter-build-args=--no-codesign

      - name: Compactar Arquivos Gerados do iOS
        run: |
          cd build/ipa || cd build/ios || cd build
          zip -r ../vida_do_cuei_ios.zip .

      - name: Disponibilizar o App iOS para Download (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: App-iOS-Vida-do-Cuei
          path: vida_do_cuei_ios.zip
